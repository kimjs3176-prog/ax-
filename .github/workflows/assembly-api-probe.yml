# 열린국회정보 위원회 회의록 API 명세·응답 확인용 진단 워크플로.
# ASSEMBLY_API_KEY Actions secret이 있으면 사용하고, 없으면 인증키 없이(샘플 모드) 호출한다.
name: 국회 API 점검

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/assembly-api-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KEY: ${{ secrets.ASSEMBLY_API_KEY }}
    steps:
      - name: API 명세 페이지(요청인자·출력값)
        run: |
          curl -sS -m 30 -A "Mozilla/5.0" \
            "https://open.assembly.go.kr/portal/data/service/selectAPIServicePage.do/OR137O001023MZ19321" -o spec.html || true
          python3 - <<'PY'
          import html, re
          t = open("spec.html", encoding="utf-8", errors="ignore").read()
          t = re.sub(r"(?is)<(script|style).*?</\1>", " ", t)
          t = re.sub(r"(?i)</(tr|p|div|li|h\d)>|<br\s*/?>", "\n", t)
          t = re.sub(r"(?i)</t[dh]>", " | ", t)
          t = html.unescape(re.sub(r"<[^>]+>", " ", t))
          lines = [re.sub(r"\s+", " ", l).strip() for l in t.splitlines()]
          lines = [l for l in lines if l and l != "|"]
          text = "\n".join(lines)
          for kw in ("요청주소", "요청인자", "출력값"):
              i = text.find(kw)
              print(f"===== {kw} (위치 {i}) =====")
              if i >= 0:
                  print(text[i:i + 2500])
          print("===== 전체 길이", len(text))
          PY

      - name: 요청인자 조합별 호출
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          key = os.environ.get("KEY", "")
          base = "https://open.assembly.go.kr/portal/openapi/ncwgseseafwbuheph"
          combos = [
              {},
              {"DAE_NUM": "22"},
              {"CONF_DATE": "2024-10-07"},
              {"DAE_NUM": "22", "CONF_DATE": "2024-10-07"},
              {"DAE_NUM": "22", "CONF_DATE": "20241007"},
              {"DAE_NUM": "22", "CONF_DATE": "2024"},
              {"DAE_NUM": "22", "COMM_NAME": "농림축산식품해양수산위원회"},
              {"DAE_NUM": "22", "CONF_DATE": "2024-10-07", "COMM_NAME": "농림축산식품해양수산위원회"},
          ]
          print("인증키 사용:", bool(key))
          for extra in combos:
              q = {"Type": "json", "pIndex": 1, "pSize": 3, **extra}
              if key:
                  q["KEY"] = key
              url = base + "?" + urllib.parse.urlencode(q)
              try:
                  raw = urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"}), timeout=30).read().decode("utf-8")
                  data = json.loads(raw)
              except Exception as e:
                  print(f"--- {extra}: 요청 실패 {str(e).replace(key, '***') if key else e}")
                  continue
              if "RESULT" in data:
                  print(f"--- {extra}: {data['RESULT']}")
                  continue
              blocks = next(iter(data.values()))
              head = blocks[0].get("head", [])
              rows = blocks[1].get("row", []) if len(blocks) > 1 else []
              print(f"--- {extra}: head={head}")
              if rows:
                  print("    필드:", list(rows[0].keys()))
                  print("    예시:", json.dumps(rows[0], ensure_ascii=False)[:1200])
          PY
