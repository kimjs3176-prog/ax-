# 열린국회정보 위원회 회의록 API 명세·응답 확인용 진단 워크플로.
# ASSEMBLY_API_KEY Actions secret이 있으면 사용하고, 없으면 인증키 없이(샘플 모드) 호출한다.
name: 국회 API 점검

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/assembly-api-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KEY: ${{ secrets.ASSEMBLY_API_KEY }}
    steps:
      - name: 요청인자 조합별 호출
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          key = os.environ.get("KEY", "")
          base = "https://open.assembly.go.kr/portal/openapi/ncwgseseafwbuheph"
          combos = [
              {"DAE_NUM": "22", "CONF_DATE": "2024-10"},
              {"DAE_NUM": "22", "CONF_DATE": "2024-10", "COMM_NAME": "농림축산식품해양수산위원회"},
              {"DAE_NUM": "22", "CONF_DATE": "2024", "COMM_NAME": "농림축산식품해양수산위원회"},
              {"DAE_NUM": "22", "CONF_DATE": "2024", "COMM_NAME": "농림축산식품해양수산"},
              {"DAE_NUM": "22", "CONF_DATE": "2024", "COMM_NAME": "농림축산식품해양수산위원회 법안심사소위원회"},
          ]
          print("인증키 사용:", bool(key))
          for extra in combos:
              q = {"Type": "json", "pIndex": 1, "pSize": 1000, **extra}
              if key:
                  q["KEY"] = key
              url = base + "?" + urllib.parse.urlencode(q)
              try:
                  raw = urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"}), timeout=30).read().decode("utf-8")
                  data = json.loads(raw)
              except Exception as e:
                  print(f"--- {extra}: 요청 실패 {str(e).replace(key, '***') if key else e}")
                  continue
              if "RESULT" in data:
                  print(f"--- {extra}: {data['RESULT']}")
                  continue
              blocks = next(iter(data.values()))
              head = blocks[0].get("head", [])
              rows = blocks[1].get("row", []) if len(blocks) > 1 else []
              print(f"--- {extra}: head={head}")
              print(f"    받은 행 수(pSize=1000): {len(rows)}")
              names = sorted({r.get("COMM_NAME") for r in rows})
              print("    위원회명:", names[:15])
              kinds = sorted({str(r.get("CLASS_NAME")) for r in rows})
              print("    회의종류:", kinds)
              if rows:
                  print("    예시 제목:", [r.get("TITLE") for r in rows[:3]])
          PY

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 실제 회의록 PDF 파싱 점검
        run: |
          pip install -q -r requirements.txt
          python3 - <<'PY'
          from collections import Counter
          from agrisea.pipeline import download_minutes_text
          from agrisea.parser import parse_minutes
          from pathlib import Path
          for mid in ("52457",):  # 제418회 제4차 농해수위(2024-10-07)
              url = f"https://record.assembly.go.kr/assembly/viewer/minutes/download/pdf.do?id={mid}"
              text = download_minutes_text(url, Path("pdf"), mid)
              print(f"===== {mid}: 텍스트 {len(text)}자")
              print(text[:1500])
              print("..... 발언 표지(◯/○) 개수:", text.count("◯") + text.count("○"))
              doc = parse_minutes(text)
              print("안건:", doc.agendas)
              print("발언 수:", len(doc.utterances))
              print("발언자 유형:", Counter(u.speaker_type for u in doc.utterances))
              print("발언자:", Counter(f"{u.speaker_role} {u.speaker_name}" for u in doc.utterances).most_common(15))
              print("질의/이행약속/자료요구:", sum(u.is_question for u in doc.utterances),
                    sum(u.is_commitment for u in doc.utterances), sum(u.is_data_request for u in doc.utterances))
              for u in doc.utterances[:8]:
                  print(f"  [{u.speaker_type}] {u.speaker_role} {u.speaker_name} (안건 {u.agenda_idx}): {u.text[:120]}")
          PY
