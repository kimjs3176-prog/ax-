# 회의록 자동 수집: 열린국회정보 API로 농해수위 회의록을 모아 data/seed.sqlite3.gz 로 커밋한다.
# 커밋되면 Vercel이 새로 배포하면서 이 데이터를 싣는다(배포 환경의 저장소는 임시라서 이 방식으로 영구 보관).
#  - 매일 06:00(KST) 실행: 저장된 마지막 회의일 7일 전부터 오늘까지 수집
#  - 초기 데이터가 없으면 22대 임기 시작일(2024-05-30)부터 전체 수집
#  - 수집 후 회의 요약·쟁점/기관 집계·관계망·지식그래프(data/kg.nt.gz)를 미리 계산해 함께 커밋
#  - 내용이 바뀌었을 때만 커밋
# 저장소 Settings > Secrets and variables > Actions 에 ASSEMBLY_API_KEY 를 등록해야 한다.
name: 회의록 데이터 갱신

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 KST
  workflow_dispatch:
    inputs:
      date_from:
        description: "수집 시작일(YYYY-MM-DD). 비우면 자동(마지막 회의일 7일 전부터)"
        required: false
      date_to:
        description: "수집 종료일(YYYY-MM-DD). 비우면 오늘"
        required: false
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-data.yml"   # 이 워크플로가 처음 머지될 때 전체 수집 1회 실행
      # 분석 규칙(발언자 분류·쟁점 사전·요약 등)이 바뀌면 저장된 데이터를 다시 계산해 반영
      - "agrisea/lexicon.py"
      - "agrisea/parser.py"
      - "agrisea/nlp.py"
      - "agrisea/analysis.py"
      - "agrisea/precompute.py"
      - "agrisea/spacing.py"

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
      AGRISEA_DATA_DIR: ${{ github.workspace }}/var
      # 회의록 PDF 서버는 해외(Actions) 접속이 막혀 있어 서울 리전 배포본을 거쳐 본문을 받는다.
      # 배포 주소가 바뀌면 저장소 Variables에 MINUTES_PROXY 로 지정.
      AGRISEA_MINUTES_PROXY: ${{ vars.MINUTES_PROXY || 'https://ax-rosy-seven.vercel.app/api/minutes-text' }}
    steps:
      # 이벤트 시점 커밋이 아니라 실행 시작 시점의 최신 브랜치를 받는다(앞선 실행이 커밋한 데이터를 이어받기 위함)
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 기존 데이터 불러오기
        run: |
          mkdir -p var
          if [ -f data/seed.sqlite3.gz ]; then gunzip -c data/seed.sqlite3.gz > var/agrisea.sqlite3; fi
          python -m agrisea stats

      - name: 수집
        env:
          DATE_FROM: ${{ inputs.date_from }}
          DATE_TO: ${{ inputs.date_to }}
        run: |
          if [ -z "$ASSEMBLY_API_KEY" ]; then echo "::error::ASSEMBLY_API_KEY secret이 없습니다."; exit 1; fi
          if [ -n "$DATE_FROM" ]; then
            python -m agrisea collect --from "$DATE_FROM" ${DATE_TO:+--to "$DATE_TO"} --fetch
          else
            python -m agrisea collect --resume ${DATE_TO:+--to "$DATE_TO"} --fetch
          fi
          python -m agrisea fetch-minutes   # 이전에 실패한 본문 재시도
          python -m agrisea stats

      - name: 사전 계산(요약·집계·지식그래프) 및 초기 데이터 내보내기
        run: |
          python -m agrisea export-seed
          ls -la data/

      - name: 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seed.sqlite3.gz data/seed.meta.json data/kg.nt.gz
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "chore(data): 농해수위 회의록 자동 수집 반영"
          # 그사이 다른 실행이 데이터를 커밋했으면, 방금 만든 데이터 파일을 우선해 다시 얹는다
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
